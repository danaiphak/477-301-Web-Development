<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--<link rel="stylesheet" href="style.css">-->
</head>
<body>
    <title>Document</title>
    <style>
        h1, h2 {
            color: blue;
            text-align: center;
        }
        p {
            font-size: 16px;
            color: yellow;
            background-color: red;
        }
        div {
            background-color: lightgray !important;
            padding: 20px;
            border-radius: 5px;
        }
        #div-id1 {
            background-color: lightblue;
            padding: 10px;
            margin: 10px;
        }
        #div-id2 {
            background-color: lightgreen;
            padding: 15px;
            margin: 15px;
        }
        .div-class {
            border: 2px solid black;
            padding: 10px;
        }
        h1, #div-id1, #div-id2, .div-class {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        a:hover {
            color: red;
            font-weight: bold;            
        }
        a:visited {
            color: purple;
        }
    </style>
</body>
<body>
    <h1>Welcome to My Website</h1>
    <h2 style="color: green; background-color: aqua;">This is a Subheading</h2>
    <div>
        <p>This is a sample paragraph inside a div element.</p>
    </div>
    <div id=""div-id1">
        <p>This is a paragraph inside div with ID 'div-id1'.</p>
    </div>
    <div id="div-id2" class="div-class">
        <p>This is a paragraph inside div with ID 'div-id2'.</p>
    </div>
    <a href="https://www.example.com">Visit Example.com</a>
</body>
</html>
