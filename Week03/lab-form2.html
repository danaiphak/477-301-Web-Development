<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Contact Page</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="contact page">
            <h2>Contact us</h2>
            <p>Please fill out the form below to get in touch with us.</p>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="40" required></textarea><br><br>
                <input type="submit" value="Submit">
            </form>
            <fieldset>
                <legend>Contact Information</legend>
                <label for="contact-info">Email:</label>
                <input type="text" name="contact-info" value="Email: info@company.com" readonly>
                <label for="contact-info">Phone:</label>
                <input type="text" name="contact-info" value="Phone: (123) 456-7890" readonly>
            </fieldset>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Company Name. All rights reserved.</p>
</body>
</html>
